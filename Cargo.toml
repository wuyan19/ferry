[workspace]
resolver = "2"
members = ["crates/ferry-tftp", "crates/ferry-core", "crates/ferry"]

# 发布产物优化：thin LTO + 单编译单元 + 去符号，体积减半、运行更快；
# 长驻服务不启用 panic = "abort"（panic 展开让单任务失败不拖垮进程）。
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
base64 = "0.22"
ipnet = "2"
schemars = "1"
bytes = "1"
tempfile = "3"
