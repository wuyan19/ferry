name: Release

# ferry 为纯 Rust 单二进制:cargo 构建 → gh 直传 draft release,人工核对后发布。
# 触发:推 v* tag 或 Actions 页手动 dispatch(填 tag)。
# 目标选择:Linux 用 musl 静态(设备/路由器/容器即拷即用,不挑 libc),
# Windows/macOS 各打原生;依赖全为纯 Rust(无 ring/openssl),musl 交叉无需 musl-gcc。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # 发布闸门:全部测试通过才允许出产物
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  # 先单独建 draft release(幂等),矩阵各腿只管上传——避免多腿并发 create 竞态。
  # dispatch 场景输入的 tag 可能尚不存在:gh release create 会以默认分支 HEAD 自动建 tag。
  prepare:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Guard tag == Cargo.toml version
        run: |
          set -e
          ver=$(sed -n '/\[workspace.package\]/,/^\[/p' Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)
          if [ "v$ver" != "$TAG" ]; then
            echo "tag $TAG 与 Cargo.toml 版本 $ver 不一致"; exit 1
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" || gh release create "$TAG" --draft \
            --title "ferry $TAG" \
            --notes "ferry $TAG — 草稿，发布前请人工核对产物与 sha256。变更见 README / protocol.md。"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # 设备/软路由场景优先:x86_64 与 aarch64 静态(测试机 ipq60xx 即 aarch64)
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # 文件名带 tag 与 target:设备端多版本共存可辨;每腿自带 .sha256,无跨腿聚合依赖
      - name: Checksum + upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ext=""
          case "${{ matrix.target }}" in *-windows-*) ext=".exe";; esac
          src="target/${{ matrix.target }}/release/ferry${ext}"
          out="ferry-$TAG-${{ matrix.target }}${ext}"
          cp "$src" "$out"
          sha256sum "$out" > "$out.sha256"
          ls -la "$out"
          gh release upload --clobber "$TAG" "$out" "$out.sha256"

  # 更新清单:等 build 五腿资产全部上传后,从 draft release 下载它们计算
  # sha256 + minisign 签名,拼出信封式 update-manifest.json({payload, signature})
  # 再传回同一 release。客户端(src/update.rs)验签后才解析 payload。
  # 平台 key = 编译目标三元组,与 update.rs 的 PLATFORM_KEY(build.rs 注入)是硬约定。
  # 注意 draft release 不会被 releases/latest 命中——发布后必须 publish,
  # 否则所有已安装客户端都查不到更新。
  manifest:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: manifest

      - name: Cargo.toml version must match tag
        run: |
          ver=$(sed -n '/\[workspace.package\]/,/^\[/p' Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)
          if [ "v$ver" != "$TAG" ]; then
            echo "::error::Cargo.toml ($ver) 与 tag ($TAG) 不一致——manifest 版本号取自 tag,客户端版本比较会错乱"
            exit 1
          fi

      # 签名是强制步骤:secrets 缺失直接 fail(无签名的 manifest 会被客户端拒绝,
      # 静默跳过只是把失败推迟到用户端)。口令经临时文件而非 argv 传给签名工具
      # ——GitHub 的 secret 自动 redaction 不覆盖子进程 argv。
      - name: Materialize signing key
        env:
          UPDATE_MINISIGN_KEY: ${{ secrets.UPDATE_MINISIGN_KEY }}
          UPDATE_MINISIGN_PASSWORD: ${{ secrets.UPDATE_MINISIGN_PASSWORD }}
        run: |
          if [ -z "$UPDATE_MINISIGN_KEY" ]; then
            echo "::error::缺少 secret UPDATE_MINISIGN_KEY。生成:cargo run --example keygen_update -- --password=<口令>,把 .sign/minisign.key 全文与口令配到 UPDATE_MINISIGN_KEY / UPDATE_MINISIGN_PASSWORD"
            exit 1
          fi
          if [ -z "$UPDATE_MINISIGN_PASSWORD" ]; then
            echo "::error::缺少 secret UPDATE_MINISIGN_PASSWORD(空口令也需显式配空字符串)"
            exit 1
          fi
          printf '%s' "$UPDATE_MINISIGN_KEY" > "$HOME/.ferry-update.key"
          printf '%s' "$UPDATE_MINISIGN_PASSWORD" > "$HOME/.ferry-update.pwd"
          chmod 600 "$HOME/.ferry-update.key" "$HOME/.ferry-update.pwd"
          # 指纹诊断(不泄露内容):核对 secret 是否粘贴完整
          echo "key: $(wc -l < "$HOME/.ferry-update.key") lines; sha256=$(sha256sum "$HOME/.ferry-update.key" | cut -c1-16)"
          echo "pwd: $(wc -c < "$HOME/.ferry-update.pwd") bytes"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern 'ferry-*' --dir assets

      - name: Build signing tool
        run: cargo build --release --example sign_update

      - name: Build signed update-manifest.json
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, subprocess, sys

          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          sign_tool = "target/release/examples/sign_update"
          key_path = os.path.expanduser("~/.ferry-update.key")
          pwd_path = os.path.expanduser("~/.ferry-update.pwd")

          def sign(path):
              # 返回 minisign .sig 全文(多行)。口令经 --password-file,不进 argv。
              r = subprocess.run(
                  [sign_tool, "--key", key_path, "--password-file", pwd_path, path],
                  capture_output=True, text=True,
              )
              if r.returncode != 0:
                  print(f"sign_update 失败(exit {r.returncode}):{r.stderr}", file=sys.stderr)
                  raise SystemExit(1)
              return r.stdout

          def asset(name):
              path = os.path.join("assets", name)
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return {
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "size": os.path.getsize(path),
                  "sha256": h.hexdigest(),
                  "signature": sign(path),
              }

          version = tag[1:] if tag.startswith("v") else tag
          targets = [
              "x86_64-unknown-linux-musl",
              "aarch64-unknown-linux-musl",
              "x86_64-pc-windows-msvc",
              "aarch64-apple-darwin",
              "x86_64-apple-darwin",
          ]
          platforms = {}
          for t in targets:
              ext = ".exe" if "-windows-" in t else ""
              platforms[t] = asset(f"ferry-{tag}-{t}{ext}")

          # payload 是「内层 manifest 的 JSON 字符串」:签名对这段字符串的字节,
          # 客户端验签原文后再 parse(两端字节确定一致)。
          payload = json.dumps({
              "version": version,
              "notes_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "platforms": platforms,
          }, ensure_ascii=False)
          with open("payload.json", "w") as f:
              f.write(payload)
          envelope = {"payload": payload, "signature": sign("payload.json")}
          with open("update-manifest.json", "w") as f:
              json.dump(envelope, f, indent=2)
          print("signed manifest built for", len(platforms), "platforms")
          EOF

      - name: Shred signing key
        if: always()
        run: rm -f "$HOME/.ferry-update.key" "$HOME/.ferry-update.pwd" payload.json

      - name: Upload update-manifest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" update-manifest.json --clobber --repo "$GITHUB_REPOSITORY"

      # smoke 自检:把刚上传的 manifest 下载回来,走客户端同一条验签路径
      # (verify_manifest example 与 check_latest 共用 parse_signed_manifest)。
      # 在这里失败好过发布后所有客户端静默拒绝更新——特别是 secret 与仓库内
      # 公钥不配对的场景。
      - name: Smoke verify manifest (client path)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern update-manifest.json --clobber
          cargo run --release --example verify_manifest -- update-manifest.json
